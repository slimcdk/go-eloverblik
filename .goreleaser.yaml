# GoReleaser configuration for the go-eloverblik CLI.
# Docs: https://goreleaser.com
#
# Local dry run:
#   goreleaser check
#   goreleaser build --snapshot --clean --single-target
#
# A real release is cut by pushing a v* tag; see .github/workflows/release.yml.
version: 2

project_name: go-eloverblik

before:
  hooks:
    # Fail before the build matrix starts rather than halfway through it:
    #   go mod tidy -diff  go.mod/go.sum are not what `go mod tidy` would write
    #                      (a missing go.sum entry, a require nothing uses); it
    #                      prints the diff. It runs first: go mod download would
    #                      quietly add a missing go.sum line before it could see it.
    #   go mod download    a module go.mod requires cannot be downloaded, or does
    #                      not match its hash in go.sum.
    #   go mod verify      a module in the local module cache was changed after
    #                      it was downloaded.
    # -diff only reports. Deliberately not a plain "go mod tidy": a release must
    # build the code as tagged, never rewrite go.mod/go.sum underneath itself.
    - go mod tidy -diff
    - go mod download
    - go mod verify

builds:
  - id: go-eloverblik
    # The CLI main package lives at the repo root; the library lives in v1/.
    main: .
    binary: go-eloverblik
    env:
      # Static Linux binaries: no libc dependency, so the Linux artifacts run on any
      # distro (the macOS binaries still link the system's libSystem, as every macOS
      # program does), and cross-compilation needs no C toolchain.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      # 32-bit ARM, for the Raspberry Pis that cannot run the arm64 binary: the Pi 1,
      # Zero, Zero W and the Pi 2 before v1.2, and any Pi booted with a 32-bit kernel
      # (`uname -m` prints armv6l or armv7l). Linux only: Go has no darwin/arm or
      # windows/arm port, and GoReleaser skips those pairs by itself.
      - arm
    goarm:
      # ARMv6 only. A GOARM=6 binary runs on every 32-bit Pi, ARMv7 cores included,
      # while a GOARM=7 binary dies with SIGILL on the ARMv6 core of the Pi Zero and
      # Pi 1. One ARM build, so its archive is plainly linux_arm. The ARMv6 test
      # steps in .github/workflows/test.yml and release.yml and the build matrix in
      # test.yml set GOARM themselves rather than reading it from here: change them
      # with it, by hand.
      - "6"
    flags:
      # Strip local filesystem paths from the binary so the same commit produces
      # the same bytes regardless of where it was built.
      - -trimpath
    ldflags:
      # -s -w drop the symbol table and DWARF debug info.
      #
      # -X sets the version --version prints, with the v of the tag, as go install
      # reports it. The variable lives in package cmd, not main, so GoReleaser's
      # default main.version would miss it; the linker ignores -X for a symbol that
      # does not exist, so check --version on a snapshot build when moving it.
      - -s -w -X github.com/slimcdk/go-eloverblik/cmd.version=v{{ .Version }}
    # Reproducible builds: timestamp the binary from the commit, not from "now".
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: go-eloverblik
    ids:
      - go-eloverblik
    # tar.gz everywhere, zip on Windows where tar.gz is awkward to open.
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      # Merge commits carry no information a reader of the changelog wants.
      - "^Merge pull request"
      - "^Merge branch"
      - "^Merge remote-tracking branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: CI
      regexp: '^.*?ci(\([[:word:]]+\))??!?:.+$'
      order: 3
    # Anything that does not follow the conventional-commit prefixes still shows
    # up, so a release note is never silently incomplete.
    - title: Other changes
      order: 999

release:
  # The tag decides. A tag like v1.3.0-rc.1 is published as a pre-release.
  prerelease: auto
  draft: false
  name_template: "v{{ .Version }}"
  footer: |
    ## Install

    Download the archive for your platform below, verify it against
    `checksums.txt`, unpack it and put `go-eloverblik` on your `PATH`.
    On a Raspberry Pi, `uname -m` decides: `aarch64` takes `linux_arm64`,
    `armv6l` or `armv7l` takes `linux_arm`. Windows on Arm takes
    `windows_arm64`. The binaries need no Go installation and bring their own
    time zone database.

    Or install with Go:

    ```sh
    go install github.com/slimcdk/go-eloverblik@{{ .Tag }}
    ```
