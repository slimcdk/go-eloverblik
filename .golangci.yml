version: "2"
run:
  modules-download-mode: readonly
  tests: true
  # Lint v1/live_test.go too. Linting compiles it but never runs it, so nothing reaches
  # Eloverblik; only go test -tags live runs it.
  build-tags:
    - live
linters:
  enable:
    - errorlint # errors compared with == or formatted with %v instead of wrapped
    - gocritic
    - gosec
    - misspell
    - modernize # what go fix proposes, kept from creeping back in
    - nilnesserr
    - nolintlint
    - revive
    - testifylint # error assertions with require, so a failed one stops the test
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    gosec:
      excludes:
        - G401
        - G501
        - G505
    govet:
      disable:
        - shadow
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
          disabled: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - gosec
          - revive
        path: _test\.go
      - linters:
          - lll
        path: (.*)?_gen\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
