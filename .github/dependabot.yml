# Dependabot configuration.
#
# This file previously tracked devcontainers only, which meant nothing watched the
# Go modules or the GitHub Actions used by the workflows. That is how the lint job
# was allowed to rot silently: golangci-lint-action drifted several major versions
# and no PR was ever opened to say so. Every ecosystem the repository actually uses
# is now covered.
#
# Maintained by hand: Dependabot updates go.mod and the uses: lines of the
# workflows, but does not see a version in a run step or in an action input
# (with:). These pins are such versions, so no PR will ever be opened for them:
#   - the golangci-lint version (version: input of golangci-lint-action, test.yml)
#   - the govulncheck pin (go install ...@vX.Y.Z in a run step, security.yml)
#   - the Go line (go-version: input of setup-go, both jobs in security.yml)
#
# Docs: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#       https://containers.dev/guide/dependabot

version: 2

updates:
  # Go module dependencies for the library (v1/) and the CLI (repository root).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Copenhagen"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      # Conventional commits: every Go module bump arrives as "fix(deps): bump ...",
      # including the test-only ones (testify, httpmock). Dependabot supports no
      # separate prefix for development dependencies of Go modules
      # (prefix-development does not apply to gomod), so there is nothing to set.
      prefix: "fix"
      include: "scope"
    groups:
      # Collapse the routine churn into a single PR per week. Major bumps still
      # arrive as individual PRs, because those are the ones that need reading.
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The actions referenced by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Copenhagen"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The development container definition.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Copenhagen"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "devcontainer"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      devcontainers:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
